name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: shellcheck
        run: shellcheck --severity=warning bootstrap.sh bin/.local/bin/reconcile-managed
      - name: syntax
        run: |
          bash -n bootstrap.sh bin/.local/bin/reconcile-managed
          zsh -n shell/.zshrc
